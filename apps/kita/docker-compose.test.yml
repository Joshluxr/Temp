# TEST-PLAT-02 isolated PostgreSQL 18 (coder-23 sql-isolate lane).
# NOT production. NO seed money: the container starts an empty cluster; the only data that
# ever lands is the DDL-declared non-monetary reference rows from migrations/001_core.sql.
# Sandbox balances are never imported here — see packages/database/src/invariant.ts.
name: kita-sql-isolate-test

services:
  postgres:
    image: postgres:18
    container_name: kita-plat02-pg
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: kita_owner
      POSTGRES_PASSWORD: kita_owner
      POSTGRES_DB: kita_plan_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kita_owner -d kita_plan_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
