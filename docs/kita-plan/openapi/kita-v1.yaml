openapi: 3.1.0
info:
  title: Kita remittance v1
  version: 1.0.0-plan.2026-11-09
  description: Planning contract. Provisional feature IDs; original user specification missing (DEP-00). No production
    activation. Money integers are strings; independent workflow states; no generic paid or balance mutation.
servers:
- url: https://api.sandbox.kita.example
  description: Reserved example domain; sandbox contract only
- url: https://api.kita.example
  description: Reserved example domain; production address assigned at deployment
paths:
  /v1/auth/authorization-requests:
    post:
      operationId: startAuthorization
      summary: Start authorization
      tags:
      - public
      description: Every referenced object is ownership and legal-entity scoped. Server rechecks current capability,
        state, version, holds and policy. All provider/regulatory capabilities unverified for Kita as of 2026-11-09;
        disabled capabilities return CAPABILITY_UNAVAILABLE.
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Durable accepted resource or current read projection. Asynchronous status is not payment
            completion.
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
              description: private, no-store for authenticated responses
            Operation-Id:
              schema:
                type: string
                format: uuid
              description: Durable command ID for recovery.
            Idempotency-Replayed:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedSession'
        '202':
          description: Existing or newly queued operation is still pending; lookup by operation ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          headers:
            Operation-Id:
              schema:
                type: string
                format: uuid
              description: Durable command ID for recovery.
            Idempotency-Replayed:
              schema:
                type: boolean
        '400':
          description: Invalid schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Scope or assurance denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found or not owned
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version, state, quote expiry, idempotency mismatch, approval or unknown-outcome conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Valid shape but business policy/capability rejects
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited; Retry-After applies
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dependency unavailable; do not substitute a mock
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-feature-ids: []
      x-authorization: Public abuse limits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
