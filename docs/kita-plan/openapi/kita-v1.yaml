              type: object
              additionalProperties: true
      x-provider-authentication-required: true
components:
  securitySchemes:
    customerBearer:
      type: http
      scheme: bearer
      bearerFormat: OIDC access token, audience kita-customer
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: OIDC workforce token, audience kita-admin
    customerSession:
      type: apiKey
      in: cookie
      name: __Host-kita_customer
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
      description: Stable per actor/book/operation. Same hash replays original result; different hash409. Retained
        for signed financial record retention; never just Redis TTL.
  schemas:
    Money:
      type: object
      additionalProperties: false
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        minor:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})$
          description: Nonnegative integer minor units as canonical decimal string; server enforces <=9000000000000000,
            known currency exponent and lower capability limits. Never parse through Number.
      required:
      - currency
      - minor
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 2000
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        requestId:
          type: string
          format: uuid
        retryable:
          type: boolean
        operationId:
          type: string
          format: uuid
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              code:
                type: string
            required:
            - field
            - code
      required:
      - type
      - title
      - status
      - code
      - requestId
      - retryable
    Operation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - running
          - succeeded
          - rejected
          - unknown
        resourceId:
          type: string
          format: uuid
        resourceType:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 0
        problem:
          $ref: '#/components/schemas/Problem'
      required:
      - id
      - state
      examples:
      - id: 60000000-0000-4000-8000-000000000001
        state: unknown
        resourceId: 70000000-0000-4000-8000-000000000001
        resourceType: transfer
        retryAfterSeconds: 60
    Command:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: string
          pattern: ^[1-9][0-9]*$
        reasonCode:
          type: string
          minLength: 1
          maxLength: 2000
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        evidenceIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - expectedVersion
      - reasonCode
      - reason
    Profile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
          pattern: ^[1-9][0-9]*$
        country:
          type: string
          pattern: ^[A-Z]{2}$
        region:
          type: string
        nameMasked:
          type: string
        status:
          type: string
          enum:
          - pending
          - active
          - restricted
          - closed
        identityStatus:
          type: string
        locale:
          type: string
          enum:
          - en
          - fil
      required:
      - id
      - version
      - country
      - status
      - identityStatus
      - locale
    Content:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
        locale:
          type: string
          enum:
          - en
          - fil
        version:
          type: string
        body:
          type: string
        legalEntity:
          type: string
        effectiveAt:
          type: string
          format: date-time
      required:
      - slug
      - locale
      - version
      - body
      - legalEntity
      - effectiveAt
    Corridor:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        originCountry:
          type: string
        originRegion:
          type: string
        destinationCountry:
          type: string
        sourceCurrency:
          type: string
        destinationCurrency:
          type: string
        enabled:
          type: boolean
        unavailableReason:
          type: string
        products:
          type: array
          items:
            type: string
        methods:
          type: array
          items:
            type: string
        policyVersion:
          type: string
      required:
      - id
      - originCountry
      - destinationCountry
      - sourceCurrency
      - destinationCurrency
      - enabled
      - products
      - methods
      - policyVersion
    PayoutOption:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        method:
          type: string
          enum:
          - bank
          - gcash
          - maya
          - cash_pickup
          - bill
        institutionCode:
          type: string
        name:
          type: string
        minimum:
          $ref: '#/components/schemas/Money'
        maximum:
          $ref: '#/components/schemas/Money'
        calendarVersion:
          type: string
        requiredFields:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
              type:
                type: string
                enum:
                - string
                - date
                - enum
              required:
                type: boolean
              allowedValues:
                type: array
                items:
                  type: string
            required:
            - name
            - type
            - required
        enabled:
          type: boolean
      required:
      - id
      - method
      - institutionCode
      - name
      - minimum
      - maximum
      - calendarVersion
      - requiredFields
      - enabled
    EstimateRequest:
      type: object
      additionalProperties: false
      properties:
        corridorId:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - send
          - receive
        amount:
          $ref: '#/components/schemas/Money'
        fundingMethod:
          type: string
          enum:
          - ach
          - debit
          - credit
          - apple_pay
          - google_pay
          - wallet
        payoutMethod:
          type: string
          enum:
          - bank
          - gcash
          - maya
          - cash_pickup
          - bill
      required:
      - corridorId
      - direction
      - amount
      - fundingMethod
      - payoutMethod
    Estimate:
      type: object
      additionalProperties: false
      properties:
        indicative:
          const: true
        asOf:
          type: string
          format: date-time
        sourceAmount:
          $ref: '#/components/schemas/Money'
        receiveAmount:
          $ref: '#/components/schemas/Money'
        estimatedFee:
          $ref: '#/components/schemas/Money'
        rate:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,18})?$
        executable:
          const: false
      required:
      - indicative
      - asOf
      - sourceAmount
      - receiveAmount
      - estimatedFee
      - rate
      - executable
    RecipientInput:
      type: object
      additionalProperties: false
      properties:
        payoutOptionId:
          type: string
          format: uuid
        legalName:
          type: string
          minLength: 1
          maxLength: 200
        relationship:
          type: string
          maxLength: 60
        destinationToken:
          type: string
          minLength: 1
          maxLength: 512
        validationSessionId:
          type: string
          format: uuid
        country:
          type: string
          enum:
          - PH
      required:
      - payoutOptionId
      - legalName
      - relationship
      - destinationToken
      - country
    Recipient:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        version:
          type: string
          pattern: ^[1-9][0-9]*$
        method:
          type: string
          enum:
          - bank
          - gcash
          - maya
          - cash_pickup
          - bill
        legalNameMasked:
          type: string
        destinationMasked:
          type: string
        validationState:
          type: string
          enum:
          - pending
          - valid
          - invalid
          - expired
        active:
          type: boolean
      required:
      - id
      - versionId
      - version
      - method
      - legalNameMasked
      - destinationMasked
      - validationState
      - active
    DraftInput:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: string
          pattern: ^[1-9][0-9]*$
        sourceTransferId:
          type: string
          format: uuid
        corridorId:
          type: string
          format: uuid
        recipientVersionId:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - send
          - receive
        amount:
          $ref: '#/components/schemas/Money'
        fundingMethod:
          type: string
        step:
          type: string
          enum:
          - amount
          - recipient
          - verification
          - review
          - funding
      required:
      - corridorId
      - direction
      - amount
      - fundingMethod
      - step
    Draft:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
          pattern: ^[1-9][0-9]*$
        expiresAt:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/DraftInput'
      required:
      - id
      - version
      - expiresAt
      - data
    QuoteRequest:
      type: object
      additionalProperties: false
      properties:
        corridorId:
          type: string
          format: uuid
        recipientVersionId:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - send
          - receive
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        fundingMethod:
          type: string
          enum:
          - ach
          - debit
          - credit
          - apple_pay
          - google_pay
          - wallet
        fundingInstrumentId:
          type: string
          format: uuid
        speed:
          type: string
          enum:
          - economy
          - express
        promoCode:
          type: string
          maxLength: 40
        pointsToRedeem:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})$
          description: Nonnegative integer minor units as canonical decimal string; server enforces <=9000000000000000,
            known currency exponent and lower capability limits. Never parse through Number.
        locale:
          type: string
          enum:
          - en
          - fil
      required:
      - corridorId
      - recipientVersionId
      - direction
      - amount
      - fundingMethod
      - speed
      - locale
      description: amount currency must match source for send, destination for receive; recipient/method/corridor/instrument
        and promotion/points exclusivity checked server-side. No executable fallback rate.
      examples:
      - corridorId: 10000000-0000-4000-8000-000000000001
        recipientVersionId: 20000000-0000-4000-8000-000000000001
        direction: send
        amount:
          currency: USD
          minor: '50000'
        fundingMethod: ach
        fundingInstrumentId: 30000000-0000-4000-8000-000000000001
        speed: economy
        locale: en
    Quote:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        recipientVersionId:
          type: string
          format: uuid
        principal:
          $ref: '#/components/schemas/Money'
        grossFee:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        receive:
          $ref: '#/components/schemas/Money'
