        minimumReceiveMinor:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})$
          description: Nonnegative integer minor units as canonical decimal string; server enforces <=9000000000000000,
            known currency exponent and lower capability limits. Never parse through Number.
        targetNetRate:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,18})?$
        maximumFeeMinor:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})$
          description: Nonnegative integer minor units as canonical decimal string; server enforces <=9000000000000000,
            known currency exponent and lower capability limits. Never parse through Number.
        maximumExecutions:
          type: integer
          minimum: 1
          maximum: 365
        dailyLimitMinor:
          type: string
          pattern: ^[1-9][0-9]{0,15}$
        totalLimitMinor:
          type: string
          pattern: ^[1-9][0-9]{0,15}$
        timeZone:
          type: string
        localSchedule:
          type: string
        expiresAt:
          type: string
          format: date-time
        mandateHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        stepUpId:
          type: string
          format: uuid
        sourceWalletId:
          type: string
          format: uuid
      required:
      - kind
      - sourceCurrency
      - destinationCurrency
      - maximumSourceMinor
      - maximumFeeMinor
      - maximumExecutions
      - totalLimitMinor
      - expiresAt
      - mandateHash
      - stepUpId
      allOf:
      - if:
          properties:
            kind:
              const: auto_conversion
          required:
          - kind
        then:
          required:
          - sourceWalletId
          - minimumReceiveMinor
          - targetNetRate
          - dailyLimitMinor
          properties:
            maximumExecutions:
              const: 1
      - if:
          properties:
            kind:
              const: scheduled_transfer
          required:
          - kind
        then:
          required:
          - recipientVersionId
          - minimumReceiveMinor
          - dailyLimitMinor
          - timeZone
          - localSchedule
      - if:
          properties:
            kind:
              const: reminder
          required:
          - kind
        then:
          required:
          - recipientVersionId
          - timeZone
          - localSchedule
      description: Explicit consent/mandate validation server-side. Auto-conversion initial policy funded-wallet
        one-shot, expiry<=30days; targetNetRate and all amount/fee/daily/total bounds checked at execution. Reminder
        never authorizes debit. Missing consent on automatic occurrence skips/notifies.
