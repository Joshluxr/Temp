      - expectedVersion
      - kind
      - sourceAccountId
      - destinationAccountId
      - amount
      - evidenceIds
      - reason
      examples:
      - expectedVersion: '1'
        kind: prefund
        sourceAccountId: 10000000-0000-4000-8000-000000000001
        destinationAccountId: 20000000-0000-4000-8000-000000000001
        amount:
          currency: PHP
          minor: '2871000'
        evidenceIds:
        - 80000000-0000-4000-8000-000000000001
        reason: Replenish approved provider prefund from real corporate cash.
    StablecoinTreasuryRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: string
          pattern: ^[1-9][0-9]*$
        kind:
          type: string
          const: stablecoin
        sourceAccountId:
          type: string
          format: uuid
        destinationAccountId:
          type: string
          format: uuid
        assetPolicyId:
          type: string
          format: uuid
        issuer:
          type: string
          maxLength: 200
        network:
          type: string
          maxLength: 100
        assetContract:
          type: string
          maxLength: 256
        decimals:
          type: integer
          minimum: 0
          maximum: 38
        atomicUnits:
          type: string
          pattern: ^[1-9][0-9]{0,37}$
        destinationAllowlistId:
          type: string
          format: uuid
        evidenceIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 20
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - expectedVersion
      - kind
      - sourceAccountId
      - destinationAccountId
      - assetPolicyId
      - issuer
      - network
      - assetContract
      - decimals
      - atomicUnits
      - destinationAllowlistId
      - evidenceIds
      - reason
      description: DEP-11 gated; asset policy must exactly bind issuer/contract/network/decimals and finality; chain
        confirmation is not available PHP fiat.
      examples:
      - expectedVersion: '1'
        kind: stablecoin
        sourceAccountId: 10000000-0000-4000-8000-000000000001
        destinationAccountId: 20000000-0000-4000-8000-000000000001
        assetPolicyId: 30000000-0000-4000-8000-000000000001
        issuer: fixture-issuer
        network: fixture-network
        assetContract: fixture-contract
        decimals: 6
        atomicUnits: '1000000'
        destinationAllowlistId: 40000000-0000-4000-8000-000000000001
        evidenceIds:
        - 80000000-0000-4000-8000-000000000001
        reason: Disabled test-only atomic-unit contract example; not a live instruction.
