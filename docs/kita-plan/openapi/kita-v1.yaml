          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Valid shape but business policy/capability rejects
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited; Retry-After applies
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dependency unavailable; do not substitute a mock
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Raw body exceeds configured bound
      x-feature-ids:
      - KITA-PLAT-04
      x-authorization: Provider-specific raw-body authentication before durable acknowledgment
      requestBody:
        required: true
        description: Exact vendor raw bytes, maximum 256 KiB by default. Adapter checks contracted signature/MAC/mTLS
          and replay freshness. Unsigned hints require authenticated provider inquiry before financial effect. Never
          interpret a generic X-Signature as sufficient for every provider.
        content:
          application/json:
